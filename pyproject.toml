[project]
name = "fsm"
version = "0.1.0"
description = "Private LAN-first media storage service."
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.95.2",
    "uvicorn==0.22.0",
    "python-multipart==0.0.6",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "httpx==0.24.1",
    "boto3>=1.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
